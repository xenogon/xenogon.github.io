<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" href="{{ '/index.xml' | relative_url }}" title="{{ site.title | escape }}">
  </head>
  <body>
    <main id="main-content">
      <header class="header">
        <div class="header-grid">
          <div class="portrait-col">
            <img class="portrait-img" width="96" height="96" alt="{{ site.title | escape }}" src="{{ '/assets/img/author.jpg' | relative_url }}">
          </div>
          <div class="name-col">
            {% if page.url == '/' %}
            <h1 class="name">{{ site.title | escape }}</h1>
            {% else %}
            <p class="name"><a href="{{ '/' | relative_url }}">{{ site.title | escape }}</a></p>
            {% endif %}
            <nav class="links" aria-label="Contact links">
              <a href="https://github.com/xenogon">GitHub</a>
              <a href="https://linkedin.com/in/simonkalicinski">LinkedIn</a>
              <a href="mailto:simon.kalicinski@pm.me">Email</a>
            </nav>
          </div>
        </div>
      </header>
      {{ content }}
    </main>
    <footer class="site-footer">
      <small>© {{ site.time | date: '%Y' }} {{ site.author | escape }}</small>
    </footer>
  </body>
</html>
