title: Simon Kalicinski
author: Simon Kalicinski
description: Analytics Engineer building data lakehouses on AWS
url: https://xenogon.github.io
timezone: Europe/Stockholm
permalink: /posts/:title/
future: false
theme: null

plugins: [jekyll-feed, jekyll-sitemap]
feed:
